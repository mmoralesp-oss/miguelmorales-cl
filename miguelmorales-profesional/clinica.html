<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Atención clínica y supervisiones de Miguel Morales Pérez.">
  <title>clínica · miguel morales perez</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&display=swap");

    :root {
      --paper: #f7f7f4;
      --ink: #181918;
      --muted: #70716e;
      --line: #d8d9d5;
      --serif: "Newsreader", "Iowan Old Style", Baskerville, serif;
    }

    * { box-sizing: border-box; }

    html {
      background: var(--paper);
      color: var(--ink);
      font-size: 16px;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--paper);
      font-family: var(--serif);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    a:focus-visible {
      outline: 1px solid var(--ink);
      outline-offset: 5px;
    }

    .site-header {
      width: calc(100% - 80px);
      min-height: 104px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 48px;
      font-size: 17px;
    }

    .brand { flex: 0 0 auto; }

    .site-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 16px 28px;
    }

    .site-nav a {
      position: relative;
      color: #343634;
    }

    .site-nav a::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -6px;
      left: 0;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 180ms ease;
    }

    .site-nav a:hover::after,
    .site-nav a[aria-current="page"]::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .clinic {
      width: min(calc(100% - 80px), 1240px);
      margin: 0 auto;
      padding: 82px 0 120px;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      column-gap: 54px;
    }

    .clinic-label {
      margin: 2px 0 0;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.4;
    }

    .clinic-text {
      max-width: 650px;
    }

    .clinic-text h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 400;
      line-height: 1.35;
    }

    .contact {
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .contact a {
      position: relative;
      color: var(--ink);
    }

    .contact a::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -3px;
      left: 0;
      height: 1px;
      background: currentColor;
    }

    @media (max-width: 760px) {
      .site-header {
        width: calc(100% - 48px);
        padding: 28px 0 32px;
        display: block;
      }

      .brand {
        display: inline-block;
        margin-bottom: 26px;
      }

      .site-nav {
        justify-content: flex-start;
        gap: 13px 22px;
        font-size: 13px;
      }

      .clinic {
        width: calc(100% - 48px);
        padding: 52px 0 90px;
        display: block;
      }

      .clinic-label {
        margin-bottom: 34px;
      }

      .clinic-text h1 {
        font-size: 21px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">miguel morales perez</a>
    <nav class="site-nav" aria-label="Navegación principal">
      <a href="investigacion.html">investigación</a>
      <a href="clinica.html" aria-current="page">clínica</a>
      <a href="fotografia.html">fotografía</a>
      <a href="cv.html">cv</a>
    </nav>
  </header>

  <main class="clinic">
    <p class="clinic-label">clínica</p>
    <section class="clinic-text" aria-labelledby="servicios-clinicos">
      <h1 id="servicios-clinicos">atención clínica de adultos e infanto-juvenil, supervisiones.</h1>
      <p class="contact">Contacto: <a href="mailto:mmoralesp@gmail.com">mmoralesp@gmail.com</a>, <a href="tel:+56966191158">+56966191158</a></p>
    </section>
  </main>
</body>
</html>
