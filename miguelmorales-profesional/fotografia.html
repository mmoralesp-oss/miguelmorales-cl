<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fotografía | Miguel Morales</title>
  <meta name="description" content="Proyectos fotográficos de Miguel Morales.">

  <!-- Usa el estilo general de tu sitio -->
  <link rel="stylesheet" href="styles.css">

  <style>
    .photo-page {
      width: min(1200px, calc(100% - 48px));
      margin: 0 auto;
      padding: 40px 0 60px;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 40px;
      align-items: start;
    }

    .photo-sidebar {
      position: sticky;
      top: 40px;
      align-self: start;
    }

    .photo-title {
      margin: 0 0 24px;
      font-size: 14px;
      font-weight: normal;
    }

    .photo-project-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .photo-project-button {
      appearance: none;
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      text-align: left;
      cursor: pointer;
      font: inherit;
      color: inherit;
      opacity: 0.5;
    }

    .photo-project-button:hover,
    .photo-project-button[aria-selected="true"] {
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .photo-note {
      margin-top: 28px;
      max-width: 180px;
      font-size: 12px;
      line-height: 1.4;
      opacity: 0.65;
    }

    .photo-gallery-wrap {
      min-width: 0;
    }

    .photo-gallery {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 14px;
      scroll-behavior: smooth;
      cursor: grab;
      user-select: none;
      -webkit-overflow-scrolling: touch;
    }

    .photo-gallery:active {
      cursor: grabbing;
    }

    .photo-gallery::-webkit-scrollbar {
      height: 8px;
    }

    .photo-gallery::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.18);
      border-radius: 999px;
    }

    .photo-gallery::-webkit-scrollbar-track {
      background: transparent;
    }

    .photo-item {
      flex: 0 0 auto;
      margin: 0;
    }

    .photo-item img {
      display: block;
      max-height: 74vh;
      max-width: min(72vw, 900px);
      width: auto;
      height: auto;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .photo-caption {
      margin-top: 6px;
      font-size: 11px;
      opacity: 0.6;
    }

    .photo-empty {
      display: none;
      font-size: 13px;
      opacity: 0.65;
      padding-top: 4px;
    }

    .photo-empty.is-visible {
      display: block;
    }

    @media (max-width: 800px) {
      .photo-page {
        width: calc(100% - 32px);
        display: block;
        padding: 28px 0 40px;
      }

      .photo-sidebar {
        position: static;
      }

      .photo-project-list {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 10px 18px;
      }

      .photo-note {
        display: none;
      }

      .photo-gallery-wrap {
        margin-top: 28px;
      }

      .photo-item img {
        max-height: 68vh;
        max-width: 84vw;
      }
    }
  </style>
</head>

<body>

  <!-- Si tu menú actual en index.html tiene otra estructura, puedes copiarlo aquí tal cual -->
  <header class="site-header">
    <a class="brand" href="index.html">Miguel Morales</a>

    <nav class="site-nav" aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="proyectos.html">Proyectos</a>
      <a href="fotografia.html" aria-current="page">Fotografía</a>
      <a href="clinica.html">Clínica</a>
      <a href="acerca.html">Acerca</a>
    </nav>
  </header>

  <main class="photo-page">
    <aside class="photo-sidebar">
      <h1 class="photo-title">Fotografía</h1>

      <div class="photo-project-list" role="tablist" aria-label="Proyectos fotográficos">
        <button class="photo-project-button" type="button" role="tab" aria-selected="true" data-project="rewind">
          Rewind (2019)
        </button>

        <button class="photo-project-button" type="button" role="tab" aria-selected="false" data-project="just-do-it">
          Just Do It (2017)
        </button>

        <button class="photo-project-button" type="button" role="tab" aria-selected="false" data-project="la-cascada">
          La cascada (2018)
        </button>
      </div>

    
    </aside>

    <section class="photo-gallery-wrap" aria-live="polite">
      <div id="photoGallery" class="photo-gallery" tabindex="0"></div>
      <p id="photoEmpty" class="photo-empty">Aún no hay imágenes cargadas para este proyecto.</p>
    </section>
  </main>

  <script>
    const PROJECTS = {
      "rewind": {
        title: "Rewind (2019)",
        folder: "images/fotografia/rewind"
      },
      "just-do-it": {
        title: "Just Do It (2017)",
        folder: "images/fotografia/just-do-it"
      },
      "la-cascada": {
        title: "La cascada (2018)",
        folder: "images/fotografia/la-cascada"
      }
    };

    const gallery = document.getElementById("photoGallery");
    const emptyMessage = document.getElementById("photoEmpty");
    const buttons = [...document.querySelectorAll(".photo-project-button")];

    function twoDigits(number) {
      return String(number).padStart(2, "0");
    }

    function tryLoadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject();
        img.src = src;
      });
    }

    async function loadProject(projectKey) {
      const project = PROJECTS[projectKey];

      gallery.innerHTML = "";
      gallery.scrollLeft = 0;
      emptyMessage.classList.remove("is-visible");

      let foundAny = false;

      for (let i = 1; i <= 60; i++) {
        const num = twoDigits(i);
        const src = `${project.folder}/${num}.jpg`;

        try {
          await tryLoadImage(src);

          foundAny = true;

          const figure = document.createElement("figure");
          figure.className = "photo-item";

          const img = document.createElement("img");
          img.src = src;
          img.alt = `${project.title}, fotografía ${num}`;
          img.loading = "eager";
          img.decoding = "async";
          img.draggable = false;

          const caption = document.createElement("figcaption");
          caption.className = "photo-caption";
          caption.textContent = num;

          figure.appendChild(img);
          figure.appendChild(caption);
          gallery.appendChild(figure);

        } catch (error) {
          break;
        }
      }

      if (!foundAny) {
        emptyMessage.classList.add("is-visible");
      }

      gallery.setAttribute("aria-label", `Galería: ${project.title}`);
    }

    function selectProject(projectKey) {
      buttons.forEach(button => {
        button.setAttribute(
          "aria-selected",
          button.dataset.project === projectKey ? "true" : "false"
        );
      });

      loadProject(projectKey);
    }

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        selectProject(button.dataset.project);
      });
    });

    // Convierte la rueda vertical en desplazamiento horizontal
    gallery.addEventListener("wheel", (event) => {
      if (Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
        event.preventDefault();
        gallery.scrollLeft += event.deltaY;
      }
    }, { passive: false });

    // Arrastrar con el mouse
    let isDragging = false;
    let startX = 0;
    let startScrollLeft = 0;

    gallery.addEventListener("mousedown", (event) => {
      isDragging = true;
      startX = event.pageX;
      startScrollLeft = gallery.scrollLeft;
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
    });

    gallery.addEventListener("mouseleave", () => {
      isDragging = false;
    });

    gallery.addEventListener("mousemove", (event) => {
      if (!isDragging) return;
      event.preventDefault();

      const distance = event.pageX - startX;
      gallery.scrollLeft = startScrollLeft - distance;
    });

    // Navegación con teclado
    gallery.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") {
        gallery.scrollBy({ left: 320, behavior: "smooth" });
      }

      if (event.key === "ArrowLeft") {
        gallery.scrollBy({ left: -320, behavior: "smooth" });
      }
    });

    // Proyecto inicial
    selectProject("rewind");
  </script>
</body>
</html>
